<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tu análisis de crédito · AVA Multiservices</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2a2a2a">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="../assets/css/publico.css">
  <style>
    .an { max-width: 680px; margin: 26px auto 0; }
    .an-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
    .an-top img { height: 40px; width: auto; }
    .an-n { text-align: right; font-size: 13px; color: var(--muted); }
    .an-n b { display: block; font-family: var(--font-serif); font-size: 24px; font-weight: 500; color: var(--ink); line-height: 1.15; }
    .an h2 { margin: 26px 0 10px; font-family: var(--font-serif); font-size: 24px; font-weight: 500; }
    .an-k { font-size: 10.5px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); }
    .an-pts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .an-pts div { padding: 12px 8px; border-radius: 14px; background: var(--stone-50); text-align: center; }
    .an-pts small { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: var(--muted); }
    .an-pts b { display: block; font-family: var(--font-serif); font-size: 34px; font-weight: 600; line-height: 1.1; }
    .an-meta { margin-top: 8px; font-size: 13.5px; color: var(--muted); text-align: center; }
    .an-tabla { width: 100%; border-collapse: collapse; font-size: 14px; }
    .an-tabla th, .an-tabla td { padding: 9px 8px; border-bottom: 1px solid var(--line); text-align: left; }
    .an-tabla th { font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
    .an-tabla td:not(:first-child), .an-tabla th:not(:first-child) { text-align: center; }
    .an-cta { display: flex; flex-direction: column; gap: 6px; }
    .an-c { display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; border-radius: 12px; background: var(--stone-50); font-size: 14px; }
    .an-c small { display: block; color: var(--muted); font-size: 12px; }
    .an-c span:last-child { text-align: right; font-size: 12.5px; color: var(--muted); flex: none; }
    .an-tx { font-size: 15px; line-height: 1.6; white-space: pre-wrap; }
    .an-srv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 14px; padding: 0; list-style: none; font-size: 14.5px; }
    .an-srv li::before { content: "✓ "; color: var(--accent); font-weight: 700; }
    .an-prop { padding: 18px; border-radius: 18px; background: var(--charcoal); color: #fff; }
    .an-prop .an-k { color: #d9c4ac; }
    .an-precio { font-family: var(--font-serif); font-size: 44px; font-weight: 500; line-height: 1.1; margin: 4px 0 10px; }
    .an-prop p { font-size: 14px; opacity: 0.9; margin: 4px 0; }
    .an-croa { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: var(--accent-50, #f3ede6); font-size: 13px; line-height: 1.5; }
    .an-ok { padding: 16px; border-radius: 16px; background: #e3f4e8; color: #15803d; font-weight: 600; text-align: center; }
    .an-acepta { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
    .an-acepta input { height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line-strong, #d8d2c8); font: inherit; font-size: 15px; }
    .an-err { color: #b4472f; font-size: 13.5px; }
    @media (max-width: 560px) { .an-srv { grid-template-columns: 1fr; } .an-pts b { font-size: 28px; } }
    @media print { body { background: #fff; } .p-top, .p-foot, .p-actions, .an-acepta { display: none !important; } .p-card { box-shadow: none; padding: 0; } .an-prop { background: #fff; color: #000; border: 1px solid #000; } }
  </style>
</head>
<body>
<header class="p-top"><div class="container">
  <a href="../" class="brand" aria-label="AVA Multiservices"><img class="brand-logo" src="../assets/img/logo.svg" alt="AVA" width="72" height="34"><span class="brand-divider"></span><span class="brand-sub">Análisis<br>de crédito</span></a>
</div></header>
<main class="p-main"><div class="container">
  <div class="p-card an" id="card">
    <div id="cargando" class="muted" style="text-align:center">Cargando tu análisis…</div>
    <div id="doc" hidden></div>
  </div>
  <div class="p-actions" id="acciones" hidden style="max-width:680px;margin-inline:auto;justify-content:center">
    <a class="btn btn-ghost" id="pregunta" href="#" target="_blank" rel="noopener" hidden><span>Tengo una pregunta</span></a>
    <button class="btn btn-ghost" type="button" onclick="window.print()"><span>Imprimir o guardar PDF</span></button>
  </div>
</div></main>
<footer class="p-foot">AVA Multiservices · Dallas, Texas</footer>
<script src="../assets/js/analisis.js?v=1"></script>
</body>
</html>
