<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Panel · AVA Multiservices</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2a2a2a">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../assets/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <style>
    body { background: var(--soft); }
    body::before { display: none; }
    [hidden] { display: none !important; }

    /* Acceso */
    .auth { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px; background:
      radial-gradient(700px 500px at 100% 0%, rgba(164, 162, 148, 0.25), transparent 60%), var(--soft); }
    .auth-card { width: 100%; max-width: 420px; padding: 36px 32px; border-radius: 26px; background: #fff; border: 1px solid var(--line); box-shadow: 0 40px 80px -50px rgba(42, 42, 42, 0.5); }
    .auth-card .logo { width: 110px; height: auto; margin: 0 auto; }
    .auth-card .sub { margin-top: 6px; text-align: center; font-size: 9.5px; font-weight: 700; letter-spacing: 0.36em; text-transform: uppercase; color: var(--accent); }
    .auth-card h1 { margin-top: 24px; text-align: center; font-size: 30px; font-weight: 500; }
    .auth-card p.lead { margin-top: 6px; text-align: center; font-size: 14px; color: var(--muted); }
    .auth-card form { display: grid; gap: 14px; margin-top: 24px; }
    .auth-card label { font-size: 13px; font-weight: 600; }
    .auth-card .btn { width: 100%; }
    .link-btn { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; font-size: 13.5px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
    .msg { padding: 12px 14px; border-radius: 12px; font-size: 13.5px; font-weight: 500; }
    .msg.error { background: #fbeee9; color: #b4472f; }
    .msg.ok { background: var(--accent-50); color: var(--accent); }

    /* Panel */
    .topbar { position: sticky; top: 0; z-index: 20; background: rgba(250, 249, 247, 0.9); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
    .topbar .container { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 66px; }
    .who { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
    .who b { color: var(--ink); font-weight: 600; }
    .panel-main { padding: 30px 0 60px; }
    .ph { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .ph h1 { font-size: clamp(32px, 4vw, 44px); font-weight: 500; }
    .ph h1 .serif { color: var(--accent); }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 22px; }
    .stat { padding: 16px 18px; border-radius: 16px; background: #fff; border: 1px solid var(--line); cursor: pointer; text-align: left; transition: border-color 0.3s; }
    .stat:hover, .stat.on { border-color: var(--accent); }
    .stat .k { font-family: var(--font-serif); font-size: 34px; line-height: 1; color: var(--charcoal); }
    .stat .l { margin-top: 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
    .tools { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
    .tools .input { height: 44px; }
    .tools .search { flex: 1 1 240px; }
    .tools select { flex: 0 0 190px; }

    .list { margin-top: 16px; border-radius: 18px; background: #fff; border: 1px solid var(--line); overflow: hidden; }
    .row { display: grid; grid-template-columns: 1.6fr 1.2fr 1fr 0.9fr 0.7fr; gap: 12px; align-items: center; width: 100%; padding: 14px 18px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer; font-size: 14px; transition: background 0.2s; }
    .row:last-child { border-bottom: 0; }
    .row:hover { background: var(--stone-50); }
    .row.head { cursor: default; background: var(--soft); font-size: 10.5px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
    .row .name { font-weight: 600; }
    .row .muted { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
    .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .pill.nuevo { background: #f6ede4; color: #a2622a; }
    .pill.en_proceso { background: var(--sage-50); color: #6c6a5c; }
    .pill.completado { background: #e8f2ea; color: #3f7a4a; }
    .pill.archivado { background: var(--soft); color: var(--muted); }
    .empty { padding: 50px 20px; text-align: center; color: var(--muted); }

    /* Detalle */
    .drawer-bg { position: fixed; inset: 0; z-index: 50; background: rgba(27, 27, 26, 0.45); backdrop-filter: blur(3px); }
    .drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 51; width: min(620px, 100%); background: #fff; box-shadow: -30px 0 60px -30px rgba(0, 0, 0, 0.4); display: flex; flex-direction: column; animation: slide 0.45s var(--ease); }
    @keyframes slide { from { transform: translateX(40px); opacity: 0; } }
    .d-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 22px 24px; border-bottom: 1px solid var(--line); }
    .d-head h2 { font-size: 30px; font-weight: 500; }
    .d-head .meta { font-size: 12.5px; color: var(--muted); }
    .x { width: 40px; height: 40px; flex: none; border-radius: 50%; border: 1px solid var(--line); background: #fff; cursor: pointer; display: grid; place-items: center; }
    .d-body { flex: 1; overflow-y: auto; padding: 8px 24px 24px; }
    .d-sec { padding: 18px 0; border-bottom: 1px solid var(--line); }
    .d-sec:last-child { border-bottom: 0; }
    .d-sec h3 { font-size: 10.5px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
    .kv { display: grid; grid-template-columns: 170px 1fr; gap: 8px 14px; font-size: 14px; }
    .kv dt { color: var(--muted); }
    .kv dd { margin: 0; font-weight: 500; word-break: break-word; white-space: pre-wrap; }
    .secret { display: inline-flex; align-items: center; gap: 8px; }
    .secret button { border: 1px solid var(--line); background: var(--soft); border-radius: 8px; padding: 2px 8px; font-size: 12px; cursor: pointer; }
    .docs { display: grid; gap: 8px; }
    .doc { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--stone-50); font-size: 14px; }
    .doc .btn { height: 36px; padding: 0 14px; font-size: 12.5px; }
    .d-foot { display: grid; gap: 10px; padding: 18px 24px; border-top: 1px solid var(--line); background: var(--stone-50); }
    .d-foot .row2 { display: flex; gap: 10px; }
    .d-foot select { flex: 1; height: 46px; }
    .d-foot textarea { min-height: 80px; }

    @media (max-width: 760px) {
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .row { grid-template-columns: 1fr auto; }
      .row .c-email, .row .c-obj, .row .c-date { display: none; }
      .row.head { display: none; }
      .tools select { flex: 1 1 100%; }
      .kv { grid-template-columns: 1fr; gap: 2px; }
      .kv dd { margin-bottom: 8px; }
      .who span { display: none; }
    }
  </style>
</head>
<body>

<!-- Acceso -->
<section class="auth" id="view-login" hidden>
  <div class="auth-card">
    <img class="logo" src="../assets/img/logo.svg" alt="AVA" width="110" height="52">
    <div class="sub">Multiservices</div>
    <h1>Panel de solicitudes</h1>
    <p class="lead">Ingresa con tu correo y contraseña.</p>
    <form id="login-form">
      <div class="msg" id="login-msg" hidden></div>
      <div class="field"><label for="l-email">Correo</label><input class="input" id="l-email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="l-pass">Contraseña</label><input class="input" id="l-pass" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-dark" type="submit"><span class="btn-label">Ingresar</span><span class="spinner" aria-hidden="true"></span></button>
      <div style="text-align:center"><button type="button" class="link-btn" id="forgot">Olvidé mi contraseña</button></div>
    </form>
  </div>
</section>

<!-- Nueva contraseña -->
<section class="auth" id="view-reset" hidden>
  <div class="auth-card">
    <img class="logo" src="../assets/img/logo.svg" alt="AVA" width="110" height="52">
    <h1>Nueva contraseña</h1>
    <p class="lead">Elige una contraseña de al menos 10 caracteres.</p>
    <form id="reset-form">
      <div class="msg" id="reset-msg" hidden></div>
      <div class="field"><label for="r-pass">Nueva contraseña</label><input class="input" id="r-pass" type="password" autocomplete="new-password" minlength="10" required></div>
      <button class="btn btn-dark" type="submit">Guardar contraseña</button>
    </form>
  </div>
</section>

<!-- Sin acceso -->
<section class="auth" id="view-denied" hidden>
  <div class="auth-card" style="text-align:center">
    <img class="logo" src="../assets/img/logo.svg" alt="AVA" width="110" height="52">
    <h1>Sin acceso</h1>
    <p class="lead">Esta cuenta no tiene permiso para ver el panel.</p>
    <div style="margin-top:20px"><button class="btn btn-ghost" data-logout>Cerrar sesión</button></div>
  </div>
</section>

<!-- Panel -->
<div id="view-panel" hidden>
  <header class="topbar">
    <div class="container">
      <a href="../" class="brand" aria-label="AVA Multiservices">
        <img class="brand-logo" src="../assets/img/logo.svg" alt="AVA" width="72" height="34"><span class="brand-divider"></span><span class="brand-sub">Panel<br>admin</span>
      </a>
      <div class="who"><span>Sesión: <b id="who-email"></b></span><button class="btn btn-ghost btn-sm" data-logout>Salir</button></div>
    </div>
  </header>

  <main class="panel-main">
    <div class="container">
      <div class="ph">
        <div><div class="kicker">Formularios</div><h1>Solicitudes <span class="serif">recibidas</span></h1></div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-ghost btn-sm" id="refresh">Actualizar</button>
          <button class="btn btn-dark btn-sm" id="export">Exportar CSV</button>
        </div>
      </div>

      <div class="stats" id="stats">
        <button class="stat" data-f="nuevo"><div class="k" data-c="nuevo">0</div><div class="l">Nuevas</div></button>
        <button class="stat" data-f="en_proceso"><div class="k" data-c="en_proceso">0</div><div class="l">En proceso</div></button>
        <button class="stat" data-f="completado"><div class="k" data-c="completado">0</div><div class="l">Completadas</div></button>
        <button class="stat" data-f=""><div class="k" data-c="total">0</div><div class="l">Total</div></button>
      </div>

      <div class="tools">
        <input class="input search" id="q" type="search" placeholder="Buscar por nombre, correo o teléfono">
        <select class="input" id="f-estado">
          <option value="">Todos los estados</option>
          <option value="nuevo">Nuevas</option>
          <option value="en_proceso">En proceso</option>
          <option value="completado">Completadas</option>
          <option value="archivado">Archivadas</option>
        </select>
      </div>

      <div class="list" id="list"></div>
    </div>
  </main>
</div>

<!-- Detalle -->
<div class="drawer-bg" id="drawer-bg" hidden></div>
<aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog" aria-labelledby="d-name">
  <div class="d-head">
    <div><div class="meta" id="d-meta"></div><h2 id="d-name"></h2></div>
    <button class="x" id="d-close" aria-label="Cerrar">✕</button>
  </div>
  <div class="d-body" id="d-body"></div>
  <div class="d-foot">
    <div class="row2">
      <select class="input" id="d-estado">
        <option value="nuevo">Nueva</option>
        <option value="en_proceso">En proceso</option>
        <option value="completado">Completada</option>
        <option value="archivado">Archivada</option>
      </select>
      <button class="btn btn-dark" id="d-save">Guardar</button>
    </div>
    <textarea class="input" id="d-notas" placeholder="Notas internas (solo visibles en el panel)"></textarea>
    <button type="button" class="link-btn" id="d-delete" style="justify-self:start;color:#b4472f">Eliminar solicitud y documentos</button>
    <div class="msg" id="d-msg" hidden></div>
  </div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.js"></script>
<script src="../assets/js/admin.js"></script>
</body>
</html>
